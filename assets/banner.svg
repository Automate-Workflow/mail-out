<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Automate-Workflow / mail-out">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B051D"/>
      <stop offset="55%" stop-color="#6B0421"/>
      <stop offset="100%" stop-color="#7F0225"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBE4E5"/>
      <stop offset="65%" stop-color="#C5B5BA"/>
      <stop offset="100%" stop-color="#90012A"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#bg-grad)" stroke="#90012A" stroke-width="2"/>

  <!-- Subtle background workflow traces on right side -->
  <g fill="none" stroke="#EBE4E5" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
    <path d="M 935 50 H 1045 L 1075 80 H 1150"/>
    <path d="M 965 130 H 1080 L 1110 100 H 1160"/>
    <path d="M 945 205 H 1030 L 1065 170 H 1145"/>
    <path d="M 1045 50 L 1080 130"/>
  </g>
  <g fill="#EBE4E5" fill-opacity="0.28">
    <circle cx="935" cy="50" r="4"/>
    <circle cx="965" cy="130" r="4"/>
    <circle cx="945" cy="205" r="4"/>
    <circle cx="1150" cy="80" r="4"/>
    <circle cx="1145" cy="170" r="4"/>
  </g>
  <circle cx="1160" cy="100" r="5" fill="#C5B5BA" fill-opacity="0.65"/>

  <!-- Left emblem: MailOut AI envelope + AI spark motif -->
  <rect x="48" y="62" width="136" height="136" rx="24" fill="#5B051D" stroke="#90012A" stroke-width="2.5"/>
  <rect x="74" y="100" width="84" height="58" rx="8" fill="none" stroke="#EBE4E5" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M 76 105 L 116 135 L 156 105" fill="none" stroke="#EBE4E5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="74" y1="172" x2="124" y2="172" stroke="#C5B5BA" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="124" cy="172" r="3.5" fill="#EBE4E5"/>

  <!-- AI spark badge -->
  <g transform="translate(154, 96)">
    <circle cx="0" cy="0" r="14" fill="#6B0421" stroke="#EBE4E5" stroke-width="2.2"/>
    <path d="M 0 -8 L 2.2 -2.2 L 8 0 L 2.2 2.2 L 0 8 L -2.2 2.2 L -8 0 L -2.2 -2.2 Z" fill="#EBE4E5"/>
  </g>

  <!-- Title and tagline -->
  <text x="224" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#C5B5BA">CHROME EXTENSION • MANIFEST V3</text>
  <text x="224" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#EBE4E5">Automate-Workflow <tspan fill="#C5B5BA">/</tspan> mail-out</text>
  <line x1="224" y1="148" x2="500" y2="148" stroke="url(#accent-line)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="512" cy="148" r="4" fill="#EBE4E5"/>
  <text x="224" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#EBE4E5" fill-opacity="0.9">MailOut AI — Gemini summarization, categorization, hybrid spam scoring &amp; templates.</text>
</svg>

